name: Set MSG91_AUTH_KEY (prod)

# One-shot: writes the account's MSG91 auth key onto the prod EC2 API .env,
# reloads config, restarts queue workers, and reports back which OTHER
# MSG91_* vars are already present (names only) plus a live re-test of
# /api/send-otp-code so we know immediately whether this alone fixed it.
#
# Mirrors set-openai-key.yml's box-side mechanism. Manual only.
# Requires secrets: MSG91_AUTH_KEY, EC2_SSH_KEY, EC2_HOST, EC2_USER,
# AWS_* + AWS_EC2_SG_ID (port-22 window, same as the production deploy).

on:
  workflow_dispatch:
    inputs:
      template_id:
        description: "MSG91 OTP template/flow ID (DLT-approved). Leave blank to keep the current value."
        required: false
        default: ""
      sender:
        description: "MSG91 Sender ID, e.g. PLNTAT. Leave blank to keep the current value."
        required: false
        default: ""
      flow_id:
        description: "MSG91 Flow ID for non-OTP transactional SMS. Leave blank to keep the current value."
        required: false
        default: ""

jobs:
  set-key:
    runs-on: ubuntu-latest
    steps:
      - name: Open port 22 for this runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP=$(curl -s ifconfig.me/ip)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true

      - name: Set MSG91_AUTH_KEY on prod EC2 .env, report config + logs
        uses: appleboy/ssh-action@v1.2.5
        env:
          MSG91_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          # Not secrets: a DLT template id and a 6-char sender id are public
          # identifiers, so they ride as plain dispatch inputs.
          MSG91_TEMPLATE_ID_IN: ${{ inputs.template_id }}
          MSG91_SENDER_IN: ${{ inputs.sender }}
          MSG91_FLOW_ID_IN: ${{ inputs.flow_id }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MSG91_KEY,MSG91_TEMPLATE_ID_IN,MSG91_SENDER_IN,MSG91_FLOW_ID_IN
          script: |
            set -e
            cd /var/www/plantathome/api
            if sudo grep -q '^MSG91_AUTH_KEY=' .env; then
              sudo sed -i "s|^MSG91_AUTH_KEY=.*|MSG91_AUTH_KEY=${MSG91_KEY}|" .env
            else
              echo "MSG91_AUTH_KEY=${MSG91_KEY}" | sudo tee -a .env >/dev/null
            fi
            # Optional extras — only written when a value was supplied, so a
            # bare dispatch never blanks something already configured.
            set_env () {
              local k="$1" v="$2"
              [ -z "$v" ] && return 0
              if sudo grep -q "^${k}=" .env; then
                sudo sed -i "s|^${k}=.*|${k}=${v}|" .env
              else
                echo "${k}=${v}" | sudo tee -a .env >/dev/null
              fi
              echo "set ${k}"
            }
            set_env MSG91_TEMPLATE_ID "${MSG91_TEMPLATE_ID_IN}"
            set_env MSG91_SENDER      "${MSG91_SENDER_IN}"
            set_env MSG91_FLOW_ID     "${MSG91_FLOW_ID_IN}"

            sudo -u www-data /usr/bin/php artisan config:clear >/dev/null
            sudo -u www-data /usr/bin/php artisan config:cache >/dev/null
            # OTP send itself is synchronous (php-fpm), but order/refund SMS via
            # notify_gateway can run through a queued listener — restart so any
            # long-running worker picks up the new key too.
            sudo -u www-data /usr/bin/php artisan queue:restart >/dev/null

            echo "── MSG91_* keys present in .env (names only) ──"
            sudo grep -oE '^MSG91_[A-Z_]+' .env | sort -u || echo "(none found)"

            echo
            echo "── does the gateway class exist on the box? ──"
            ls -l packages/marvel/src/Otp/Gateways/Msg91Gateway.php 2>&1 || echo "MISSING"
            sudo -u www-data /usr/bin/php -r 'require "vendor/autoload.php"; var_dump(class_exists("Marvel\\Otp\\Gateways\\Msg91Gateway"));' 2>&1 | tail -3

            echo
            echo "── exercise the real send path in-process (no HTTP layer) ──"
            # This is the diagnostic that matters: if the HTTP request dies as a
            # raw 502 but this prints a clean Result, the fault is the fpm worker,
            # not the gateway code.
            sudo -u www-data /usr/bin/php artisan tinker --execute='
              try {
                  $g = new \Marvel\Otp\Gateways\Msg91Gateway();
                  $r = $g->startVerification("+919999999999");
                  echo "RESULT valid=", var_export($r->isValid(), true), " errors=", json_encode($r->getErrors()), PHP_EOL;
              } catch (\Throwable $e) {
                  echo "THROWN: ", get_class($e), ": ", $e->getMessage(), PHP_EOL;
              }' 2>&1 | tail -15

            echo
            echo "── nginx errors mentioning 502 / upstream (last 40) ──"
            sudo tail -200 /var/log/nginx/error.log 2>/dev/null | grep -iE "upstream|502|SIGSEGV|exited on signal" | tail -40 || echo "(none)"

            echo
            echo "── php-fpm log (last 40) ──"
            sudo tail -40 /var/log/php8.1-fpm.log 2>/dev/null || echo "(none)"

            echo
            echo "── last 15 min of otp/msg91-related laravel log lines ──"
            sudo find storage/logs -name '*.log' -newermt '-15 minutes' -exec \
              grep -niE 'otp\.|msg91|OTP_GATEWAY|OTP_SEND' {} + 2>/dev/null | tail -40 || true

      - name: Close port 22
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true

      - name: Live re-test /api/send-otp-code (sms channel)
        if: always()
        run: |
          echo "Result AFTER patch:"
          curl -sS -w "\nHTTP:%{http_code}  time:%{time_total}s\n" -X POST \
            https://api.plantathome.in/api/send-otp-code \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"phone_number":"+911111111111","channel":"sms"}' || true
