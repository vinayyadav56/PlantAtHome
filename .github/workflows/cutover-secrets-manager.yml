name: Cutover integration credentials to Secrets Manager (prod)

# One-shot, run AFTER the IAM policy is on the PlantAtHomeEC2SSM role and AFTER the
# production deploy that stopped writing AWS keys to .env (see docs/aws/SECRETS_MANAGER_CUTOVER.md).
#
# On the prod box it: removes the stale static AWS key lines from .env, rebuilds the config
# cache and restarts the workers (so the SDK resolves the instance role), then runs
# integrations:migrate-credentials — copying every row's encrypted bag into Secrets Manager
# and verifying each copy reads back. The column is only emptied when `purge` is true; that is
# the one-way step, meant for a second run once the health sweep is green.
#
# Requires secrets: EC2_SSH_KEY, EC2_HOST, EC2_USER, AWS_* + AWS_EC2_SG_ID (port-22 window,
# same as the production deploy). Manual only.

on:
  workflow_dispatch:
    inputs:
      purge:
        description: "Empty the database column after a verified copy (one-way). Run with false first."
        type: boolean
        default: false
      dry_run:
        description: "Report what would happen and change nothing (keeps the .env key lines too)."
        type: boolean
        default: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Open port 22 for this runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP=$(curl -s ifconfig.me/ip)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true

      - name: Cut over on prod EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          PURGE: ${{ inputs.purge }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PURGE,DRY_RUN,REGION
          script: |
            set -e
            cd /var/www/plantathome/api

            echo "── identity the SDK will resolve on this box (must be the instance role) ──"
            curl -s -m 3 http://169.254.169.254/latest/meta-data/iam/security-credentials/ || echo "(no instance metadata — is the profile attached?)"
            echo

            set_env () {
              local k="$1" v="$2"
              [ -z "$v" ] && return 0
              if sudo grep -q "^${k}=" .env; then
                sudo sed -i "s|^${k}=.*|${k}=${v}|" .env
              else
                echo "${k}=${v}" | sudo tee -a .env >/dev/null
              fi
            }

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would remove AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from .env"
            else
              echo "── removing the static AWS key from .env (the instance role takes over) ──"
              sudo sed -i '/^AWS_ACCESS_KEY_ID=/d;/^AWS_SECRET_ACCESS_KEY=/d' .env
              set_env AWS_REGION "$REGION"
              set_env AWS_DEFAULT_REGION "$REGION"
              set_env APP_ENV production
              set_env INTEGRATIONS_ENVIRONMENT production
              set_env INTEGRATIONS_CREDENTIAL_STORE secrets_manager
              echo "AWS keys present in .env (names only, expect only the region + bucket):"
              sudo grep -oE '^AWS_[A-Z_]+' .env | sort -u
              sudo -u www-data /usr/bin/php artisan config:clear >/dev/null
              sudo -u www-data /usr/bin/php artisan config:cache >/dev/null
              sudo -u www-data /usr/bin/php artisan queue:restart >/dev/null
              echo "config cache rebuilt, workers signalled"
            fi

            echo
            echo "── migrate credential bags into Secrets Manager ──"
            ARGS="--environment=production"
            [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
            [ "$PURGE" = "true" ] && ARGS="$ARGS --purge"
            sudo -u www-data env HOME=/tmp /usr/bin/php artisan integrations:migrate-credentials $ARGS

            echo
            echo "── S3 through the role: HeadBucket ──"
            sudo -u www-data env HOME=/tmp /usr/bin/php artisan tinker --execute='
              try {
                  \Illuminate\Support\Facades\Storage::disk("s3")->getClient()->headBucket(["Bucket" => config("filesystems.disks.s3.bucket")]);
                  echo "S3 OK via ", config("filesystems.disks.s3.key") ? "STATIC KEY (unexpected)" : "default chain (instance role)", PHP_EOL;
              } catch (\Throwable $e) {
                  echo "S3 FAILED: ", get_class($e), PHP_EOL;
              }' 2>&1 | tail -3

      - name: Close port 22
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true
