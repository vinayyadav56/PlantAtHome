name: API – Production Deploy

# ─── Manual trigger only ───────────────────────────────────────────────────────
# Production ALWAYS deploys from main. Any other branch is rejected.
# Requires GitHub Secret:  EC2_SSH_KEY  (content of plantathome-key.pem)
#                          EC2_HOST     (3.7.30.178)
#                          EC2_USER     (ubuntu)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy — must be "main" for production'
        required: true
        default: 'main'
        type: string
      confirm:
        description: 'Type "deploy-production" to confirm — this touches live traffic'
        required: true
        type: string

jobs:
  # ── 0. Enforce main-only ──────────────────────────────────────────────────────
  validate:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main branches
        run: |
          if [ "${{ inputs.branch }}" != "main" ]; then
            echo "ERROR: Production deploys must use branch 'main'. Got: ${{ inputs.branch }}"
            exit 1
          fi
          echo "Branch check passed: ${{ inputs.branch }}"

  # ── 1. Security & Vulnerability Scan ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, exif, gd, intl, zip, bcmath, opcache
          coverage: none

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: PHP dependency vulnerability scan (composer audit)
        run: composer audit || true

      - name: PHP syntax check
        run: find app -name '*.php' | xargs php -l | grep -v 'No syntax errors' || true

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: table

  # ── 2. Tests ──────────────────────────────────────────────────────────────────
  test:
    name: PHP Test
    runs-on: ubuntu-latest
    needs: security

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plantathome_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, exif, gd, intl, zip, bcmath, opcache
          coverage: none

      # Dev deps included — this job actually RUNS the test suite (PHPUnit).
      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Copy staging env
        run: cp .env.staging.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: plantathome_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      # The full V2 suite (~132 tests, MySQL-e2e) gates the production deploy.
      - name: Run test suite
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: plantathome_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --without-tty

  # ── 3. Deploy to AWS EC2 ──────────────────────────────────────────────────────
  deploy:
    name: Deploy → AWS EC2 (Production)
    runs-on: ubuntu-latest
    needs: [security, test]
    if: inputs.confirm == 'deploy-production'
    environment: production

    steps:
      - name: Open port 22 for this runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP=$(curl -s ifconfig.me/ip)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true

      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # NOTE: GitHub caps this block at 21000 characters and REFUSES to
            # parse the workflow past it (HTTP 422 on dispatch, no run at all).
            # Keep comments short here; the long-form reasoning belongs in
            # OPERATOR_RUNBOOK_2026-08.md and docs/performance/.
            set -e

            echo "==> Pulling latest code..."
            cd /var/www/plantathome/api

            # Perms BEFORE the reset: git must be able to (re)create tracked paths under
            # storage/ — a www-data-owned storage/ made `reset --hard` die with
            # "cannot create directory at 'storage/debugbar': Permission denied".
            echo "==> Fixing permissions for deploy user (ubuntu runs all artisan cmds)..."
            sudo chown -R ubuntu:ubuntu storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            git fetch origin
            git checkout -- . 2>/dev/null || true
            git checkout main
            git reset --hard origin/main

            # Re-assert after the reset too — the reset may create fresh paths.
            sudo chown -R ubuntu:ubuntu storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "==> Clearing stale caches before install..."
            php artisan optimize:clear 2>/dev/null || true

            echo "==> Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Reinstalling the marvel/shop path package so NEW package source"
            echo "    (controllers/services/models/migrations) is picked up — composer skips"
            echo "    re-copying an unchanged-version path repo, so this is required on prod."
            composer reinstall marvel/shop --no-interaction || echo "WARNING: marvel/shop reinstall failed"
            # -a (--classmap-authoritative): classmap-only autoloading, no filesystem
            # probing on a miss. Safe here because nothing generates classes at runtime.
            composer dump-autoload -a 2>/dev/null || composer dump-autoload -o 2>/dev/null || true

            echo "==> Running migrations..."
            php artisan migrate --force

            echo "==> Seeding module-based roles & permissions (idempotent, additive)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\RolePermissionSeeder" --force \
              || echo "WARNING: RolePermissionSeeder failed"

            echo "==> Seeding designations — permission templates (idempotent, updateOrCreate)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\DesignationSeeder" --force \
              || echo "WARNING: DesignationSeeder failed"

            echo "==> Seeding service availability — Operations Control Center (idempotent, firstOrCreate)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\ServiceAvailabilitySeeder" --force \
              || echo "WARNING: ServiceAvailabilitySeeder failed"

            echo "==> Seeding master locations — states + cities (idempotent, firstOrCreate)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\LocationSeeder" --force \
              || echo "WARNING: LocationSeeder failed"

            echo "==> Seeding v2 Identity RBAC baseline (roles/permissions; NO demo users on production)..."
            php artisan db:seed --class="App\\Modules\\Identity\\Database\\Seeders\\IdentityAccessSeeder" --force \
              || echo "WARNING: IdentityAccessSeeder failed"

            echo "==> Forcing license trust ON (prevents recurring 'credentials was wrong')..."
            php artisan plantathome:ensure-trust || echo "WARNING: ensure-trust failed (env MARVEL_FORCE_TRUST still applies)"

            echo "==> Ensuring storage directories and public symlink..."
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
            php artisan storage:link --force || true

            echo "==> Pointing media at S3 (durable, served from the bucket)..."
            set_env () {
              k="$1"; v="$2"
              grep -v "^${k}=" .env > .env.tmp 2>/dev/null || true
              mv .env.tmp .env
              printf '%s=%s\n' "$k" "$v" >> .env
            }
            set_env MEDIA_DISK s3
            set_env FILESYSTEM_DISK s3
            # Queue stays on the database driver for now — the 6 live workers consume it, and
            # moving the queue is a separate, higher-blast-radius change (runbook follow-up).
            set_env QUEUE_CONNECTION database
            # Cache + rate-limiter on Redis (local redis-server + php8.1-redis, installed on the
            # box). Every cache read and every RateLimiter increment was a MySQL round trip while
            # this was `database` — ~9-11 statements/request incl. a row-lock on the primary DB.
            # REDIS_CLIENT=phpredis (the C client) is deliberate: the pure-PHP predis client was
            # measured SLOWER than the MySQL cache, so the extension is what makes this a win.
            # Rollback = set these two back to `database` + redeploy (redis-server can stay).
            set_env CACHE_DRIVER redis
            set_env CACHE_STORE redis
            set_env REDIS_CLIENT phpredis
            set_env REDIS_HOST 127.0.0.1
            set_env REDIS_PORT 6379
            # Sessions on Redis: the API is token-authed (Sanctum) so almost nothing
            # lives in sessions — but file sessions are INSTANCE-LOCAL state, the one
            # thing that blocks running a second app instance behind a load balancer. Redis
            # is already on the box; this makes the app stateless. (Enterprise audit
            # 2026-08-10 — horizontal-scalability finding.)
            set_env SESSION_DRIVER redis
            #
            # Sanctum token lifetime: tokens never expired, so a captured token was valid forever.
            # 30 days (43200 min); revoke-all-devices already exists as the theft remedy. Enabling
            # logs out sessions older than the window ONCE at deploy — accepted, near-zero users.
            set_env SANCTUM_EXPIRATION_MINUTES 43200
            # No AWS access key on the box, on purpose. S3 and Secrets Manager both run on
            # the EC2 instance profile (PlantAtHomeEC2SSM) through the SDK's default chain —
            # see docs/aws/SECRETS_MANAGER_CUTOVER.md. set_env only rewrites keys it is
            # called for, so a stale AWS_ACCESS_KEY_ID line from an earlier deploy is removed
            # by the one-shot cutover-secrets-manager.yml, not by this deploy.
            set_env AWS_DEFAULT_REGION "${{ secrets.AWS_REGION }}"
            set_env AWS_REGION "${{ secrets.AWS_REGION }}"
            set_env AWS_BUCKET plantathome-media-prod
            # Written explicitly: the secret name plantathome/{environment}/{slug} derives from
            # these, and neither was ever managed by a workflow before.
            set_env APP_ENV production
            set_env INTEGRATIONS_ENVIRONMENT production
            set_env INTEGRATIONS_CREDENTIAL_STORE secrets_manager

            echo "==> Caching config / routes / views / events..."
            php artisan config:cache || echo "WARNING: config:cache failed — running without config cache"
            php artisan route:cache  || echo "WARNING: route:cache failed — running without route cache"
            php artisan view:cache   || echo "WARNING: view:cache failed — running without view cache"
            # event:cache skips listener discovery at boot. Small win here (the
            # app registers one listener explicitly and does not enable
            # discovery), but 81 service providers boot per request and any of
            # the 38 auto-discovered packages may register listeners.
            php artisan event:cache  || echo "WARNING: event:cache failed — running without event cache"

            echo "==> Ensuring nginx compresses API responses..."
            # nginx config lives on this box, not the repo, so it is written here.
            # NO `gzip on;` -- conf.d is included INSIDE http where stock Ubuntu
            # nginx.conf already declares it, and nginx rejects a duplicate flag
            # directive. That is why this failed nginx -t on every deploy since
            # 2026-07-31. gzip was never off; gzip_types was missing (the default
            # list is text/html only). gzip_proxied any is deliberate: this API
            # sends private/no-cache, which the default would refuse to compress.
            sudo tee /etc/nginx/conf.d/zz-gzip.conf >/dev/null <<'NGINXCONF'
            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 5;
            gzip_min_length 1024;
            gzip_types application/json application/ld+json application/javascript
                       application/xml text/css text/javascript text/plain text/xml
                       image/svg+xml;
            NGINXCONF
            # Capture the output instead of discarding it. `2>/dev/null` is what
            # kept this failure unexplained for seven weeks.
            if NGINX_T="$(sudo nginx -t 2>&1)"; then
              sudo systemctl reload nginx && echo "nginx reloaded with gzip"
              # Prove it rather than imply it: ask the origin directly, bypassing
              # the CDN, and say so in the deploy log either way.
              # Two checks; each misleads alone. 1) is the directive in the
              # RUNNING merged config -- unambiguous, immune to HTTP plumbing.
              if sudo nginx -T 2>/dev/null | grep -q 'gzip_types.*application/json'; then
                echo "    verified: gzip_types is live in the merged nginx config"
              else
                echo "    WARNING: gzip_types is NOT in the merged config — a server block may override it"
              fi
              # 2) end-to-end against the ORIGIN, not Cloudflare. --resolve pins
              # the hostname to loopback over TLS; plain http://127.0.0.1 answers
              # 301, whose body is neither JSON nor over gzip_min_length -- that is
              # what made two earlier versions of this check cry wolf on a good
              # reload. /api/types is ~4 KB; /api/health is 51 B and never compresses.
              GZ=$(curl -s -k -o /dev/null -D- --max-time 10 \
                     --resolve api.plantathome.in:443:127.0.0.1 \
                     -H 'Accept-Encoding: gzip' \
                     https://api.plantathome.in/api/types 2>/dev/null || true)
              if echo "$GZ" | grep -qi '^content-encoding:.*gzip'; then
                echo "    verified: origin gzips /api/types"
              else
                echo "    NOTE: origin did not gzip /api/types on this probe"
                echo "$GZ" | head -1 | sed 's/^/      first line: /'
              fi
            else
              echo "WARNING: nginx config test failed — removing the gzip fragment and leaving nginx untouched"
              echo "$NGINX_T" | sed 's/^/    nginx -t: /'
              sudo rm -f /etc/nginx/conf.d/zz-gzip.conf
              # Re-test WITHOUT the fragment. If it still fails, the breakage was
              # already on the box and this fragment was never the culprit --
              # otherwise an unrelated pre-existing error gets blamed on it forever.
              sudo nginx -t 2>&1 | sed 's/^/    nginx -t (fragment removed): /'
            fi

            echo "==> Ensuring nginx accepts admin image uploads..."
            # The production admin could not upload ANY image over 1 MB: nginx was on
            # its 1m compiled-in default and nothing raised it (staging does, in
            # .railway/nginx.conf). Verified: 900 KB reaches auth, 1.1 MB returns 413.
            # Its OWN file -- zz-gzip.conf is deleted on any nginx -t failure and would
            # take the limit with it. 12M sits above the 10 MB cap in config/media.php
            # so the real limit stays in Laravel. http context, so both vhosts get it.
            sudo tee /etc/nginx/conf.d/zz-uploads.conf >/dev/null <<'NGINXUP'
            client_max_body_size 12M;
            NGINXUP
            if NGINX_U="$(sudo nginx -t 2>&1)"; then
              sudo systemctl reload nginx && echo "nginx reloaded with client_max_body_size 12M"
            else
              echo "WARNING: nginx config test failed — removing the upload fragment"
              echo "$NGINX_U" | sed 's/^/    nginx -t: /'
              sudo rm -f /etc/nginx/conf.d/zz-uploads.conf
            fi

            echo "==> Ensuring PHP-FPM accepts admin image uploads..."
            # Second wall: stock php8.1-fpm is 2M, so raising nginx alone moves the
            # failure from 1 MB to 2 MB, and PHP drops the file silently (misleading
            # 422). FPM scan dir EXPLICITLY: the opcache block derives its dir from
            # `php -i` = the CLI binary, so that fragment has likely never reached
            # php-fpm. Left alone on purpose; that deserves its own deploy.
            PHP_FPM_CONF_DIR=$(ls -d /etc/php/*/fpm/conf.d 2>/dev/null | tail -1)
            if [ -n "$PHP_FPM_CONF_DIR" ] && [ -d "$PHP_FPM_CONF_DIR" ]; then
              sudo tee "$PHP_FPM_CONF_DIR/99-uploads.ini" >/dev/null <<'UPLOADINI'
            upload_max_filesize=12M
            post_max_size=16M
            UPLOADINI
              echo "upload limits written to $PHP_FPM_CONF_DIR/99-uploads.ini"
            else
              echo "WARNING: could not locate the php-fpm conf.d — upload limits left at stock defaults"
            fi

            echo "==> Ensuring opcache is tuned for production..."
            # opcache ships unconfigured here. interned_strings_buffer measured 100%
            # full at 8 MB; max_accelerated_files (10000) is under the app's file
            # count so the tail of every request recompiles; memory holds both.
            # validate_timestamps=0 deliberately NOT set -- measured no benefit and
            # risks serving a stale build forever. See docs/performance/.
            # opcache.* are PHP_INI_SYSTEM, so this must be a conf.d fragment.
            PHP_CONF_DIR=$(php -i | awk -F'=> ' '/Scan this dir for additional .ini files/{print $2}' | tr -d ' ')
            if [ -n "$PHP_CONF_DIR" ] && [ -d "$PHP_CONF_DIR" ]; then
              sudo tee "$PHP_CONF_DIR/zz-opcache.ini" >/dev/null <<'OPCACHECONF'
            opcache.enable=1
            opcache.max_accelerated_files=20000
            opcache.memory_consumption=256
            opcache.interned_strings_buffer=32
            opcache.save_comments=1
            OPCACHECONF

              # opcache.preload deliberately NOT enabled; preload.php deleted. It
              # compiled 1,706 files with opcache_compile_file(), which neither links
              # nor autoloads, so 59% landed unlinked and PHP 8.1 segfaulted finalising
              # that. +0.6 ms upside vs php-fpm refusing to boot. Runbook section 6.
              echo "opcache config written to $PHP_CONF_DIR/zz-opcache.ini (preload deliberately off)"
            else
              echo "WARNING: could not locate PHP conf.d — opcache left at stock defaults"
            fi

            echo "==> Restoring www-data ownership for PHP-FPM..."
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "==> v2 async machinery: scheduler cron + queue workers (idempotent)..."
            # Everything runs AS www-data — storage/ is www-data-owned, so an
            # ubuntu-run artisan would die on log/cache writes (known gotcha).
            # 1) schedule:run every minute via /etc/cron.d (system crontab —
            #    immune to per-user cron.allow/deny quirks). Logs to a file so
            #    failures are diagnosable.
            sudo tee /etc/cron.d/plantathome-api-scheduler > /dev/null <<'CRON'
            * * * * * www-data cd /var/www/plantathome/api && /usr/bin/php artisan schedule:run >> /var/www/plantathome/api/storage/logs/schedule.log 2>&1
            CRON
            sudo chmod 644 /etc/cron.d/plantathome-api-scheduler
            # drop the older per-user entry if a previous deploy installed it
            sudo crontab -l -u www-data 2>/dev/null | grep -v 'schedule:run' | sudo crontab -u www-data - 2>/dev/null || true
            pgrep -x cron >/dev/null && echo "    cron daemon: running" || echo "    WARNING: cron daemon NOT running"
            echo "==> one-shot schedule:run as www-data (proves the cron command works; output below)"
            sudo -u www-data /usr/bin/php artisan schedule:run 2>&1 | tail -20 || echo "    WARNING: one-shot schedule:run FAILED"
            # 2) queue workers as templated systemd units, so a crashed worker is
            #    restarted by systemd rather than staying silently dead.
            sudo mkdir -p /etc/plantathome
            sudo tee /etc/plantathome/queue-default.env        > /dev/null <<<'WORKER_FLAGS=--tries=3 --timeout=120 --backoff=10'
            sudo tee /etc/plantathome/queue-careplans.env      > /dev/null <<<'WORKER_FLAGS=--tries=2 --timeout=900 --backoff=30'
            sudo tee /etc/plantathome/queue-marketing.env      > /dev/null <<<'WORKER_FLAGS=--tries=3 --timeout=280 --backoff=10'
            sudo tee /etc/plantathome/queue-images.env         > /dev/null <<<'WORKER_FLAGS=--tries=2 --timeout=900 --backoff=30'
            sudo tee /etc/plantathome/queue-images-instant.env > /dev/null <<<'WORKER_FLAGS=--tries=2 --timeout=320 --backoff=15'
            sudo tee /etc/plantathome/queue-content.env        > /dev/null <<<'WORKER_FLAGS=--tries=2 --timeout=600 --backoff=15'
            sudo tee /etc/systemd/system/plantathome-queue@.service > /dev/null <<'UNIT'
            [Unit]
            Description=PlantAtHome API queue worker (%i)
            After=network.target mysql.service

            [Service]
            User=www-data
            Group=www-data
            WorkingDirectory=/var/www/plantathome/api
            EnvironmentFile=-/etc/plantathome/queue-%i.env
            ExecStart=/usr/bin/php /var/www/plantathome/api/artisan queue:work database --queue=%i --sleep=3 --max-time=3600 $WORKER_FLAGS
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            UNIT
            sudo systemctl daemon-reload
            sudo systemctl enable --now plantathome-queue@default plantathome-queue@careplans plantathome-queue@images plantathome-queue@images-instant plantathome-queue@marketing plantathome-queue@content plantathome-queue@availability
            # restart so workers pick up the NEW code from this deploy
            sudo systemctl restart 'plantathome-queue@default' 'plantathome-queue@careplans' 'plantathome-queue@images' 'plantathome-queue@images-instant' 'plantathome-queue@marketing' 'plantathome-queue@content' 'plantathome-queue@availability'
            sudo systemctl is-active plantathome-queue@default plantathome-queue@careplans plantathome-queue@images plantathome-queue@images-instant plantathome-queue@marketing plantathome-queue@content plantathome-queue@availability

            # RESTART, not reload: this step writes a new conf.d/zz-opcache.ini, and
            # resizing the opcache shared memory segment needs a full master restart.
            # A reload keeps the old SHM and the new sizes silently never apply.
            echo "==> Restarting PHP-FPM (required to resize the opcache SHM)..."
            sudo systemctl restart php8.1-fpm || true

            # preload is no longer written, so the sed below is a no-op and this is now
            # simply a retry. Kept deliberately: the second restart costs nothing and can
            # recover a transient failure right after seven queue workers were cycled.
            if ! sudo systemctl is-active --quiet php8.1-fpm; then
              echo "ERROR: php-fpm did not start. Retrying once..."
              sudo sed -i '/opcache.preload/d' "$PHP_CONF_DIR/zz-opcache.ini" 2>/dev/null || true
              sudo systemctl restart php8.1-fpm || true
              if sudo systemctl is-active --quiet php8.1-fpm; then
                echo "php-fpm recovered on the second restart — first restart was transient."
              else
                echo "php-fpm still down after a retry — real failure, journal below."
                sudo journalctl -u php8.1-fpm -n 30 --no-pager || true
              fi
              exit 1
            fi
            sudo systemctl is-active php8.1-fpm

            echo "==> Deploy complete"

      - name: Production health check
        run: |
          echo "Waiting 15 s for PHP-FPM to reload..."
          sleep 15
          for i in 1 2 3; do
            R=$(curl -s -w "\nHTTP:%{http_code}" --max-time 15 \
              "https://api.plantathome.in/api/health" 2>/dev/null)
            echo "Attempt $i: $R"
            echo "$R" | grep -q "HTTP:200" && echo "PASS" && exit 0
            sleep 10
          done
          echo "FAIL — production health check did not return 200"
          exit 1

      - name: Close port 22 for this runner
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true
