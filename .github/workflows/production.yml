name: API – Production Deploy

# ─── Manual trigger only ───────────────────────────────────────────────────────
# Production ALWAYS deploys from main. Any other branch is rejected.
# Requires GitHub Secret:  EC2_SSH_KEY  (content of plantathome-key.pem)
#                          EC2_HOST     (3.7.30.178)
#                          EC2_USER     (ubuntu)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy — must be "main" for production'
        required: true
        default: 'main'
        type: string
      confirm:
        description: 'Type "deploy-production" to confirm — this touches live traffic'
        required: true
        type: string

jobs:
  # ── 0. Enforce main-only ──────────────────────────────────────────────────────
  validate:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main branches
        run: |
          if [ "${{ inputs.branch }}" != "main" ]; then
            echo "ERROR: Production deploys must use branch 'main'. Got: ${{ inputs.branch }}"
            exit 1
          fi
          echo "Branch check passed: ${{ inputs.branch }}"

  # ── 1. Security & Vulnerability Scan ─────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, exif, gd, intl, zip, bcmath, opcache
          coverage: none

      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: PHP dependency vulnerability scan (composer audit)
        run: composer audit || true

      - name: PHP syntax check
        run: find app -name '*.php' | xargs php -l | grep -v 'No syntax errors' || true

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: table

  # ── 2. Tests ──────────────────────────────────────────────────────────────────
  test:
    name: PHP Test
    runs-on: ubuntu-latest
    needs: security

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plantathome_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql, exif, gd, intl, zip, bcmath, opcache
          coverage: none

      # Dev deps included — this job actually RUNS the test suite (PHPUnit).
      - name: Install dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Copy staging env
        run: cp .env.staging.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: plantathome_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      # The full V2 suite (~132 tests, MySQL-e2e) gates the production deploy.
      - name: Run test suite
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: plantathome_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test --without-tty

  # ── 3. Deploy to AWS EC2 ──────────────────────────────────────────────────────
  deploy:
    name: Deploy → AWS EC2 (Production)
    runs-on: ubuntu-latest
    needs: [security, test]
    if: inputs.confirm == 'deploy-production'
    environment: production

    steps:
      - name: Open port 22 for this runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP=$(curl -s ifconfig.me/ip)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true

      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "==> Pulling latest code..."
            cd /var/www/plantathome/api
            git fetch origin
            git checkout -- . 2>/dev/null || true
            git checkout main
            git reset --hard origin/main

            echo "==> Fixing permissions for deploy user (ubuntu runs all artisan cmds)..."
            sudo chown -R ubuntu:ubuntu storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "==> Clearing stale caches before install..."
            php artisan optimize:clear 2>/dev/null || true

            echo "==> Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Reinstalling the marvel/shop path package so NEW package source"
            echo "    (controllers/services/models/migrations) is picked up — composer skips"
            echo "    re-copying an unchanged-version path repo, so this is required on prod."
            composer reinstall marvel/shop --no-interaction || echo "WARNING: marvel/shop reinstall failed"
            # -a (--classmap-authoritative) implies -o and additionally tells the
            # autoloader that the classmap is the whole truth: a class that is not
            # in it does not exist, so PHP stops doing a filesystem stat() for
            # every miss. The classmap has 15,528 entries and a request touches
            # ~1,000 files.
            #
            # Safe here because nothing generates classes at runtime — no eval(),
            # no class_alias(), no create_function() anywhere in app/ or the
            # marvel package. Deliberately NOT set in composer.json, because there
            # it would also apply to local development, where adding a new class
            # without re-dumping would then fail to autoload.
            composer dump-autoload -a 2>/dev/null || composer dump-autoload -o 2>/dev/null || true

            echo "==> Running migrations..."
            php artisan migrate --force

            echo "==> Seeding module-based roles & permissions (idempotent, additive)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\RolePermissionSeeder" --force \
              || echo "WARNING: RolePermissionSeeder failed"

            echo "==> Seeding designations — permission templates (idempotent, updateOrCreate)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\DesignationSeeder" --force \
              || echo "WARNING: DesignationSeeder failed"

            echo "==> Seeding service availability — Operations Control Center (idempotent, firstOrCreate)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\ServiceAvailabilitySeeder" --force \
              || echo "WARNING: ServiceAvailabilitySeeder failed"

            echo "==> Seeding master locations — states + cities (idempotent, firstOrCreate)..."
            php artisan db:seed --class="Marvel\\Database\\Seeders\\LocationSeeder" --force \
              || echo "WARNING: LocationSeeder failed"

            echo "==> Seeding v2 Identity RBAC baseline (roles/permissions; NO demo users on production)..."
            php artisan db:seed --class="App\\Modules\\Identity\\Database\\Seeders\\IdentityAccessSeeder" --force \
              || echo "WARNING: IdentityAccessSeeder failed"

            echo "==> Forcing license trust ON (prevents recurring 'credentials was wrong')..."
            php artisan plantathome:ensure-trust || echo "WARNING: ensure-trust failed (env MARVEL_FORCE_TRUST still applies)"

            echo "==> Ensuring storage directories and public symlink..."
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
            php artisan storage:link --force || true

            echo "==> Pointing media at S3 (durable, served from the bucket)..."
            set_env () {
              k="$1"; v="$2"
              grep -v "^${k}=" .env > .env.tmp 2>/dev/null || true
              mv .env.tmp .env
              printf '%s=%s\n' "$k" "$v" >> .env
            }
            set_env MEDIA_DISK s3
            set_env FILESYSTEM_DISK s3
            set_env QUEUE_CONNECTION database
            # Shared/persistent cache so RateLimiter (throttle:auth) actually
            # counts across requests — the cache table is migrated above.
            set_env CACHE_DRIVER database
            set_env CACHE_STORE database
            set_env AWS_ACCESS_KEY_ID "${{ secrets.AWS_ACCESS_KEY_ID }}"
            set_env AWS_SECRET_ACCESS_KEY "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            set_env AWS_DEFAULT_REGION "${{ secrets.AWS_REGION }}"
            set_env AWS_BUCKET plantathome-media-prod

            echo "==> Caching config / routes / views / events..."
            php artisan config:cache || echo "WARNING: config:cache failed — running without config cache"
            php artisan route:cache  || echo "WARNING: route:cache failed — running without route cache"
            php artisan view:cache   || echo "WARNING: view:cache failed — running without view cache"
            # event:cache skips listener discovery at boot. Small win here (the
            # app registers one listener explicitly and does not enable
            # discovery), but 81 service providers boot per request and any of
            # the 38 auto-discovered packages may register listeners.
            php artisan event:cache  || echo "WARNING: event:cache failed — running without event cache"

            echo "==> Ensuring nginx compresses API responses..."
            # The API served every response uncompressed. Production nginx config
            # lives on this box, not in the repo, so it is written here.
            # Idempotent: same file every deploy, and nginx is only reloaded when
            # the config actually changes and passes `nginx -t`.
            #
            # MEASURED compression on real endpoints:
            #   /categories?limit=100   59,274 ->  2,997 B  (19.8x)
            #   /products?limit=100    174,593 -> 12,377 B  (14.1x)
            sudo tee /etc/nginx/conf.d/zz-gzip.conf >/dev/null <<'NGINXCONF'
            gzip on;
            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 5;
            gzip_min_length 1024;
            gzip_types application/json application/ld+json application/javascript
                       application/xml text/css text/javascript text/plain text/xml
                       image/svg+xml;
            NGINXCONF
            if sudo nginx -t 2>/dev/null; then
              sudo systemctl reload nginx && echo "nginx reloaded with gzip"
            else
              echo "WARNING: nginx config test failed — removing the gzip fragment and leaving nginx untouched"
              sudo rm -f /etc/nginx/conf.d/zz-gzip.conf
            fi

            echo "==> Ensuring opcache is tuned for production..."
            # opcache is INSTALLED but entirely unconfigured on this host, so it
            # runs on stock defaults. Two of those defaults are genuinely wrong
            # for this app; a third that I expected to be wrong turned out fine,
            # and is deliberately NOT changed.
            #
            # MEASURED, and why each line is here:
            #
            #   interned_strings_buffer — measured 100% full (8 MB of 8 MB). Once
            #     that buffer fills, opcache silently stops interning and starts
            #     storing duplicate copies of every repeated string. 32 MB.
            #
            #   max_accelerated_files — the default 10000 is below this app's
            #     file count (1,547 app + 18,411 vendor; a request touches well
            #     over 10k of them). Past the limit opcache evicts, so the tail
            #     of every request recompiles. 20000.
            #
            #   memory_consumption — 256 MB to hold the above without eviction.
            #
            # NOT SET, and this is the interesting one: opcache.validate_timestamps=0.
            # I had this in an earlier revision, justified as "saves a stat() per
            # file per request". That justification was WRONG. opcache only
            # re-stats a file once per opcache.revalidate_freq seconds, which
            # defaults to 2 — so under production load the stat sweep amortises
            # across ~2 seconds of traffic and costs approximately nothing per
            # request.
            #
            # An interleaved A/B (8 rounds x 220 requests, arms alternated each
            # round to cancel host drift) found NO benefit: median paired delta
            # -0.084 ms, and validate_timestamps=0 won only 2 of 8 rounds — i.e.
            # if anything it was marginally slower, and well within noise.
            #
            # So it buys nothing measurable, while carrying a genuinely nasty
            # failure mode: PHP stops noticing changed files, and if a deploy
            # ever fails to cycle php-fpm, production serves the previous build
            # forever while every health check happily returns 200. Not worth it
            # for 0%. Left at the default.
            #
            # opcache.* are PHP_INI_SYSTEM, so .user.ini cannot set them; it has
            # to be a conf.d fragment.
            PHP_CONF_DIR=$(php -i | awk -F'=> ' '/Scan this dir for additional .ini files/{print $2}' | tr -d ' ')
            if [ -n "$PHP_CONF_DIR" ] && [ -d "$PHP_CONF_DIR" ]; then
              sudo tee "$PHP_CONF_DIR/zz-opcache.ini" >/dev/null <<'OPCACHECONF'
            opcache.enable=1
            opcache.max_accelerated_files=20000
            opcache.memory_consumption=256
            opcache.interned_strings_buffer=32
            opcache.save_comments=1
            OPCACHECONF
              echo "opcache config written to $PHP_CONF_DIR/zz-opcache.ini"
            else
              echo "WARNING: could not locate PHP conf.d — opcache left at stock defaults"
            fi

            echo "==> Restoring www-data ownership for PHP-FPM..."
            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true

            echo "==> v2 async machinery: scheduler cron + queue workers (idempotent)..."
            # Everything runs AS www-data — storage/ is www-data-owned, so an
            # ubuntu-run artisan would die on log/cache writes (known gotcha).
            # 1) schedule:run every minute via /etc/cron.d (system crontab —
            #    immune to per-user cron.allow/deny quirks). Logs to a file so
            #    failures are diagnosable.
            sudo tee /etc/cron.d/plantathome-api-scheduler > /dev/null <<'CRON'
            * * * * * www-data cd /var/www/plantathome/api && /usr/bin/php artisan schedule:run >> /var/www/plantathome/api/storage/logs/schedule.log 2>&1
            CRON
            sudo chmod 644 /etc/cron.d/plantathome-api-scheduler
            # drop the older per-user entry if a previous deploy installed it
            sudo crontab -l -u www-data 2>/dev/null | grep -v 'schedule:run' | sudo crontab -u www-data - 2>/dev/null || true
            pgrep -x cron >/dev/null && echo "    cron daemon: running" || echo "    WARNING: cron daemon NOT running"
            echo "==> one-shot schedule:run as www-data (proves the cron command works; output below)"
            sudo -u www-data /usr/bin/php artisan schedule:run 2>&1 | tail -20 || echo "    WARNING: one-shot schedule:run FAILED"
            # 2) queue workers as templated systemd units.
            # MUST stay in step with .railway/supervisord.conf (staging). A queue with no worker does
            # not error — the job sits in `jobs` forever, so the feature looks like it ran. `content`
            # is worse than silent: SweepContentBatchesCommand re-dispatches every 2 minutes with no
            # termination condition, so a batch nobody consumes grows ~720 orphan rows a day on a DB
            # that has already filled its volume once.
            sudo tee /etc/systemd/system/plantathome-queue@.service > /dev/null <<'UNIT'
            [Unit]
            Description=PlantAtHome API queue worker (%i)
            After=network.target mysql.service

            [Service]
            User=www-data
            Group=www-data
            WorkingDirectory=/var/www/plantathome/api
            ExecStart=/usr/bin/php /var/www/plantathome/api/artisan queue:work database --queue=%i --sleep=3 --tries=3 --max-time=3600
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            UNIT
            sudo systemctl daemon-reload
            sudo systemctl enable --now plantathome-queue@default plantathome-queue@careplans plantathome-queue@images plantathome-queue@images-instant plantathome-queue@marketing plantathome-queue@content
            # restart so workers pick up the NEW code from this deploy
            sudo systemctl restart 'plantathome-queue@default' 'plantathome-queue@careplans' 'plantathome-queue@images' 'plantathome-queue@images-instant' 'plantathome-queue@marketing' 'plantathome-queue@content'
            sudo systemctl is-active plantathome-queue@default plantathome-queue@careplans plantathome-queue@images plantathome-queue@images-instant plantathome-queue@marketing plantathome-queue@content

            # RESTART, not reload — this step writes a new conf.d/zz-opcache.ini
            # above, and opcache.memory_consumption / interned_strings_buffer /
            # max_accelerated_files are all PHP_INI_SYSTEM: they size shared
            # memory segments that are allocated once when the master process
            # starts. A SIGUSR2 reload re-reads the ini but cannot resize an
            # already-allocated SHM segment, so the new sizes would appear in
            # phpinfo() while the process kept running on the old 8 MB buffer —
            # the exact condition this step exists to fix, silently not fixed.
            #
            # A restart costs a sub-second window on a manually-dispatched
            # deploy, which is the right trade against applying nothing.
            echo "==> Restarting PHP-FPM (required to resize the opcache SHM)..."
            sudo systemctl restart php8.1-fpm
            sudo systemctl is-active php8.1-fpm

            echo "==> Deploy complete"

      - name: Production health check
        run: |
          echo "Waiting 15 s for PHP-FPM to reload..."
          sleep 15
          for i in 1 2 3; do
            R=$(curl -s -w "\nHTTP:%{http_code}" --max-time 15 \
              "https://api.plantathome.in/api/health" 2>/dev/null)
            echo "Attempt $i: $R"
            echo "$R" | grep -q "HTTP:200" && echo "PASS" && exit 0
            sleep 10
          done
          echo "FAIL — production health check did not return 200"
          exit 1

      - name: Close port 22 for this runner
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true
