name: Production Data Op (size-pricing / bundle / images / catalog)

# Manual, confirm-gated one-off data operations on the LIVE production catalog.
# Never runs automatically. Mirrors production.yml's SSH/security-group pattern.
#
#   size-pricing : dry-run | limit10 | full | rollback
#   bundle       : create-bundle | remove-bundle
#   images       : img-dry-run | img-limit10 | img-full | img-rollback
#   IMAGE PURGE (img-purge-files is IRREVERSIBLE — no bucket versioning):
#     img-purge-dry | img-purge | img-purge-files | img-purge-rollback
#   CATALOG REPLACE (destructive — backup first!):
#     cat-backup   → mysqldump catalog tables → storage/app/backups + S3
#     cat-restore  → restore the latest backup (rollback the replace)
#     cat-seed     → seed 1530 plants from plants.json, unpublish non-seed,
#                    assign shop, categorize, size-price, repair images

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-prod-data-op" to confirm — this touches the LIVE catalog'
        required: true
        default: ''
      mode:
        description: 'Operation to run'
        required: true
        type: choice
        options:
          - dry-run
          - limit10
          - full
          - rollback
          - create-bundle
          - remove-bundle
          - img-dry-run
          - img-limit10
          - img-full
          - img-rollback
          - img-purge-dry
          - img-purge
          - img-purge-files
          - img-purge-rollback
          - shipment-items-check
          - partner-caps-check
          - vendor-state
          - vendor-wipe
          - cat-backup
          - cat-restore
          - cat-seed
          - cat-prune
          - trust
          - tools-seed
          - pots-seed
          - sku-gen
          - recompute-availability
          - cities-seed
          - taxonomy-seed
          - company-address
          - v2-backfill-dry
          - v2-backfill
          - v2-backfill-verify
          - v2-project-shops-dry
          - v2-project-shops
          - market-sync-dry
          - market-sync
          - market-publish-dry
          - market-publish
        default: dry-run

jobs:
  validate:
    name: Validate confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Reject without confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "run-prod-data-op" ]; then
            echo "ERROR: confirmation phrase missing. Type 'run-prod-data-op'."
            exit 1
          fi
          echo "Confirmed. Mode: ${{ inputs.mode }}"

  run:
    name: Run on EC2 (Production)
    runs-on: ubuntu-latest
    needs: [validate]
    if: inputs.confirm == 'run-prod-data-op'
    environment: production
    steps:
      - name: Resolve artisan command from mode
        run: |
          case "${{ inputs.mode }}" in
            dry-run)       ARGS="plantathome:size-price-prod --dry-run" ;;
            limit10)       ARGS="plantathome:size-price-prod --limit=10" ;;
            full)          ARGS="plantathome:size-price-prod" ;;
            rollback)      ARGS="plantathome:size-price-prod --rollback" ;;
            create-bundle) ARGS="plantathome:create-demo-bundle" ;;
            remove-bundle) ARGS="plantathome:create-demo-bundle --remove" ;;
            img-dry-run)   ARGS="plantathome:repair-plant-images --dry-run" ;;
            img-limit10)   ARGS="plantathome:repair-plant-images --limit=10" ;;
            img-full)      ARGS="plantathome:repair-plant-images" ;;
            img-rollback)  ARGS="plantathome:repair-plant-images --rollback" ;;
            # Product-image purge. Two phases on purpose: img-purge clears the columns and
            # is undoable via img-purge-rollback; img-purge-files destroys the S3 objects
            # and is NOT — the media bucket has no versioning. Run img-purge on EVERY
            # environment before img-purge-files anywhere, because staging and production
            # share the bucket and a file deleted under a live reference is a broken image
            # on the storefront rather than a placeholder.
            img-purge-dry)      ARGS="plantathome:purge-product-images --dry-run" ;;
            img-purge)          ARGS="plantathome:purge-product-images --force" ;;
            img-purge-files)    ARGS="plantathome:purge-product-images --purge-files --force" ;;
            img-purge-rollback) ARGS="plantathome:purge-product-images --rollback --force" ;;
            # shipment-items-check is READ-ONLY and takes no artisan args; it rides the
            # empty-ARGS list below and runs its own inline script.
            shipment-items-check|partner-caps-check|vendor-state|vendor-wipe|cat-backup|cat-restore|cat-seed|tools-seed|pots-seed|sku-gen|recompute-availability|cities-seed|taxonomy-seed|company-address|v2-backfill-dry|v2-backfill|v2-backfill-verify|v2-project-shops-dry|v2-project-shops|market-sync-dry|market-sync|market-publish-dry|market-publish) ARGS="" ;;
            cat-prune)     ARGS="plantathome:prune-non-seed-plants" ;;
            trust)         ARGS="plantathome:ensure-trust" ;;
            *) echo "Unknown mode"; exit 1 ;;
          esac
          echo "ARTISAN_ARGS=$ARGS" >> $GITHUB_ENV
          echo "OP_MODE=${{ inputs.mode }}" >> $GITHUB_ENV

      - name: Open port 22 for this runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          RUNNER_IP=$(curl -s ifconfig.me/ip)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true

      - name: SSH run operation
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 40m
          envs: ARTISAN_ARGS,OP_MODE
          script: |
            set -e
            cd /var/www/plantathome/api
            sudo chown -R ubuntu:ubuntu storage bootstrap/cache 2>/dev/null || true

            # read a value from .env, stripping surrounding quotes
            getenv() { grep -E "^$1=" .env | head -1 | cut -d '=' -f2- | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'\$//"; }
            CATALOG_TABLES="products plant_attributes variation_options product_inclusions attribute_product category_product categories attributes attribute_values types"

            case "$OP_MODE" in
              vendor-state)
                echo "==> Vendor/nursery state and the wipe PLAN (read-only)..."
                echo "" | base64 -d > /tmp/vstate.php
                php artisan tinker --execute="$(cat /tmp/vstate.php)"
                ;;

              vendor-wipe)
                echo "==> DESTRUCTIVE: wiping vendor data (master shop + master nursery are guarded)..."
                echo "" | base64 -d > /tmp/vwipe.php
                php artisan tinker --execute="$(cat /tmp/vwipe.php)"
                php artisan cache:clear 2>/dev/null || true
                ;;

              partner-caps-check)
                echo "==> Partner capability contract as PRODUCTION sees it (read-only)..."
                echo "" | base64 -d > /tmp/caps.php
                php artisan tinker --execute="$(cat /tmp/caps.php)"
                ;;

              shipment-items-check)
                echo "==> Verifying the shipment_items backfill (read-only)..."
                echo "" | base64 -d > /tmp/bfcheck.php
                php artisan tinker --execute="$(cat /tmp/bfcheck.php)"
                ;;

              company-address)
                echo "==> Setting company address in settings.options.contactDetails.location (all language rows)..."
                echo "" | base64 -d > /tmp/set-company-address.php
                php artisan tinker --execute="$(cat /tmp/set-company-address.php)"
                rm -f /tmp/set-company-address.php
                php artisan cache:clear 2>/dev/null || true
                echo "==> COMPANY-ADDRESS COMPLETE"
                ;;

              cat-backup)
                DBHOST=$(getenv DB_HOST); DBNAME=$(getenv DB_DATABASE); DBUSER=$(getenv DB_USERNAME); DBPASS=$(getenv DB_PASSWORD)
                mkdir -p storage/app/backups
                TS=$(date +%Y%m%d-%H%M%S)
                BK="storage/app/backups/pah-catalog-${TS}.sql.gz"
                echo "==> mysqldump catalog tables → ${BK}"
                # --skip-lock-tables + no --single-transaction: SELECT-only, avoids
                # FLUSH TABLES WITH READ LOCK / LOCK TABLES (app user lacks RELOAD).
                mysqldump --skip-lock-tables --no-tablespaces --quick \
                  -h "$DBHOST" -u "$DBUSER" -p"$DBPASS" "$DBNAME" $CATALOG_TABLES | gzip > "$BK"
                ls -la "$BK"
                SZ=$(stat -c%s "$BK" 2>/dev/null || echo 0)
                echo "==> backup size: ${SZ} bytes"
                if [ "$SZ" -lt 10000 ]; then echo "ERROR: backup suspiciously small"; exit 1; fi
                # best-effort offsite copy to S3
                AWSKEY=$(getenv AWS_ACCESS_KEY_ID); AWSSEC=$(getenv AWS_SECRET_ACCESS_KEY); AWSBUCKET=$(getenv AWS_BUCKET)
                if command -v aws >/dev/null 2>&1 && [ -n "$AWSBUCKET" ]; then
                  AWS_ACCESS_KEY_ID="$AWSKEY" AWS_SECRET_ACCESS_KEY="$AWSSEC" AWS_DEFAULT_REGION="$(getenv AWS_DEFAULT_REGION)" \
                    aws s3 cp "$BK" "s3://${AWSBUCKET}/backups/$(basename $BK)" && echo "==> uploaded to S3" || echo "WARN: S3 upload failed (local backup is the restore point)"
                fi
                echo "==> BACKUP COMPLETE: $BK"
                ;;

              cat-restore)
                DBHOST=$(getenv DB_HOST); DBNAME=$(getenv DB_DATABASE); DBUSER=$(getenv DB_USERNAME); DBPASS=$(getenv DB_PASSWORD)
                BK=$(ls -t storage/app/backups/pah-catalog-*.sql.gz 2>/dev/null | head -1)
                if [ -z "$BK" ]; then echo "ERROR: no backup found in storage/app/backups"; exit 1; fi
                echo "==> Restoring catalog from ${BK}"
                gunzip -c "$BK" | mysql -h "$DBHOST" -u "$DBUSER" -p"$DBPASS" "$DBNAME"
                php artisan cache:clear 2>/dev/null || true
                echo "==> RESTORE COMPLETE from $BK"
                ;;

              sku-gen)
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                echo "==> Re-syncing marvel path package + autoloader (new command class)..."
                composer reinstall marvel/shop --no-interaction 2>&1 | tail -3 || true
                composer dump-autoload -o 2>/dev/null || true
                echo "==> Generating product SKUs on production..."
                php artisan plantathome:generate-skus
                php artisan cache:clear 2>/dev/null || true
                echo "==> SKU-GEN COMPLETE"
                ;;

              recompute-availability)
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                echo "==> Re-syncing marvel path package + autoloader (new command class)..."
                composer reinstall marvel/shop --no-interaction 2>&1 | tail -3 || true
                composer dump-autoload -o 2>/dev/null || true
                echo "==> Backfilling product_city_availability from vendor inventory + service areas..."
                php artisan marvel:recompute-city-availability
                php artisan cache:clear 2>/dev/null || true
                echo "==> RECOMPUTE-AVAILABILITY COMPLETE"
                ;;

              taxonomy-seed)
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                echo "==> Re-syncing marvel path package + autoloader (new seeders)..."
                composer reinstall marvel/shop --no-interaction 2>&1 | tail -3 || true
                composer dump-autoload -o 2>/dev/null || true
                echo "==> Plant taxonomy: attributes, category restructure (in place), collections."
                echo "    Idempotent; categories are matched BY SLUG so URLs and product links survive,"
                echo "    and characteristic-categories are folded onto the plants themselves."
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantAttributeDefinitionSeeder" --force
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantTaxonomySeeder" --force
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantCollectionSeeder" --force
                php artisan cache:clear 2>/dev/null || true
                echo "==> TAXONOMY-SEED COMPLETE"
                ;;

              cities-seed)
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                echo "==> Re-syncing marvel path package + autoloader (new seeder + bundled data)..."
                composer reinstall marvel/shop --no-interaction 2>&1 | tail -3 || true
                composer dump-autoload -o 2>/dev/null || true
                echo "==> diag: dataset present?"
                ls -la packages/marvel/data/india-cities.json 2>&1 || true
                echo "==> Seeding addressable India cities (idempotent, is_serviceable=false)..."
                php artisan db:seed --class="Marvel\\Database\\Seeders\\IndiaCitySeeder" --force
                php artisan cache:clear 2>/dev/null || true
                echo "==> CITIES-SEED COMPLETE"
                ;;

              tools-seed)
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                echo "==> diag: seeder file present in packages/marvel?"
                ls -la packages/marvel/src/Database/Seeders/PlantAtHomeToolsSeeder.php 2>&1 || true
                echo "==> diag: vendor/marvel/shop is symlink or copy?"
                ls -ld vendor/marvel/shop 2>&1 || true
                echo "==> Re-syncing marvel path package + autoloader (stale vendor copy fix)..."
                composer reinstall marvel/shop --no-interaction 2>&1 | tail -3 || true
                composer dump-autoload -o 2>/dev/null || true
                echo "==> Ensuring categories exist (idempotent — adds any missing tool categories)..."
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantAtHomeCategorySeeder" --force
                echo "==> Seeding Tools vertical catalog..."
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantAtHomeToolsSeeder" --force
                echo "==> Assigning shop to any shop-less products..."
                php artisan plantathome:assign-shop || true
                php artisan cache:clear 2>/dev/null || true
                echo "==> TOOLS-SEED COMPLETE"
                ;;

              pots-seed)
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                echo "==> diag: seeder + data present in packages/marvel?"
                ls -la packages/marvel/src/Database/Seeders/PlantAtHomePotSeeder.php packages/marvel/data/pots.json 2>&1 || true
                echo "==> Re-syncing marvel path package + autoloader (new seeder + bundled data)..."
                composer reinstall marvel/shop --no-interaction 2>&1 | tail -3 || true
                composer dump-autoload -o 2>/dev/null || true
                echo "==> Seeding Pots & Planters vertical (type + material categories + 9 pots, size-priced, idempotent)..."
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantAtHomePotSeeder" --force
                echo "==> Assigning shop to any shop-less products..."
                php artisan plantathome:assign-shop || true
                php artisan cache:clear 2>/dev/null || true
                echo "==> POTS-SEED COMPLETE"
                ;;

              v2-backfill-dry|v2-backfill|v2-backfill-verify)
                # Legacy -> V2 backfill (strangler-fig migration). Reads legacy
                # tables, upserts V2 tables keyed on legacy_id — idempotent, no
                # legacy rows are modified. Requires the production.yml deploy
                # (new code + migrations) to have run first.
                case "$OP_MODE" in
                  v2-backfill-dry)    FLAG="--dry-run" ;;
                  v2-backfill)        FLAG="" ;;
                  v2-backfill-verify) FLAG="--verify" ;;
                esac
                echo "==> php artisan v2:backfill-users $FLAG"
                php artisan v2:backfill-users $FLAG
                echo "==> php artisan v2:backfill-nurseries $FLAG"
                php artisan v2:backfill-nurseries $FLAG
                echo "==> V2-BACKFILL ($OP_MODE) COMPLETE"
                ;;

              v2-project-shops-dry|v2-project-shops)
                # V2 -> legacy projection: backfill ORPHANED v2-native nurseries
                # (legacy_id null, no legacy shop) into legacy `shops` so the
                # legacy vendor tooling (add-from-catalogue / inventory) can serve
                # them. Idempotent; skips already-linked + owner-less nurseries.
                # NOTE: run AFTER, and NOT followed by, v2-backfill on the same
                # data (the reverse legacy->V2 backfill would clobber status/owner).
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                composer dump-autoload -o 2>/dev/null || true
                case "$OP_MODE" in
                  v2-project-shops-dry) FLAG="--dry-run" ;;
                  v2-project-shops)     FLAG="" ;;
                esac
                echo "==> php artisan v2:project-nurseries-to-shops $FLAG"
                php artisan v2:project-nurseries-to-shops $FLAG
                php artisan cache:clear 2>/dev/null || true
                echo "==> V2-PROJECT-SHOPS ($OP_MODE) COMPLETE"
                ;;

              market-sync-dry|market-sync)
                # Competitor-catalogue sync: import plant NAMES as unpriced DRAFTS
                # (full NurseryLive Shopify feed + intelligence sample) then
                # de-duplicate vs the existing catalogue. Drafts are storefront-
                # invisible; existing products never touched; fully idempotent.
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                composer dump-autoload -o 2>/dev/null || true
                case "$OP_MODE" in
                  market-sync-dry) FLAG="--dry-run" ;;
                  market-sync)     FLAG="" ;;
                esac
                echo "==> php artisan market:sync-catalog $FLAG"
                php artisan market:sync-catalog $FLAG
                php artisan cache:clear 2>/dev/null || true
                echo "==> MARKET-SYNC ($OP_MODE) COMPLETE"
                ;;

              market-publish-dry|market-publish)
                # Approve/publish the imported competitor-catalogue drafts so
                # they enter the live master catalogue (vendors can attach
                # rates). Scope: master-shop unpriced drafts only; vendor
                # proposals stay under admin review. Idempotent.
                echo "==> Ensuring latest code on EC2..."
                git fetch origin 2>/dev/null && git reset --hard origin/main 2>/dev/null || true
                composer dump-autoload -o 2>/dev/null || true
                case "$OP_MODE" in
                  market-publish-dry) FLAG="--dry-run" ;;
                  market-publish)     FLAG="" ;;
                esac
                echo "==> php artisan market:publish-drafts $FLAG"
                php artisan market:publish-drafts $FLAG
                php artisan cache:clear 2>/dev/null || true
                echo "==> MARKET-PUBLISH ($OP_MODE) COMPLETE"
                ;;

              cat-seed)
                echo "==> [1/8] Seed categories..."
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantAtHomeCategorySeeder" --force
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantAtHomeCategoryBulkSeeder" --force
                echo "==> [2/8] Seed 1530 plants from plants.json (₹0, upsert by slug)..."
                php artisan db:seed --class="Marvel\\Database\\Seeders\\PlantAtHomePlantBulkSeeder" --force
                echo "==> [3/8] Unpublish non-seed (old) plants..."
                php artisan plantathome:prune-non-seed-plants
                echo "==> [4/8] Assign shop..."
                php artisan plantathome:assign-shop
                echo "==> [5/8] Categorize plants (curated categories)..."
                php artisan plantathome:categorize-plants
                echo "==> [6/8] Apply size pricing (derive S/M/L)..."
                php artisan plantathome:apply-size-pricing
                echo "==> [7/8] Repair images from S3..."
                php artisan plantathome:repair-plant-images
                echo "==> [8/8] Clear caches..."
                php artisan cache:clear 2>/dev/null || true
                echo "==> CAT-SEED COMPLETE"
                ;;

              *)
                echo "==> Running: php artisan ${ARTISAN_ARGS}"
                php artisan ${ARTISAN_ARGS}
                ;;
            esac

            sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
            echo "==> Done."

      - name: Close port 22 for this runner
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --region ${{ secrets.AWS_REGION }} || true
