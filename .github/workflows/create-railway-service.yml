name: Create Image Service on Railway (one-shot)

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Create Railway service + set env vars
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -e
          echo "==> Linking to plantathome-staging project..."
          railway link \
            --project e6fc52de-45a9-4bc0-92fe-5b9840a4d399 \
            --environment 268099e7-b634-4d26-a5ff-a95a0c145f8f

          echo "==> Creating service from GitHub repo..."
          railway add \
            --service "plantathome-image-service" \
            --repo "vinayyadav56/plantathome-image-service" \
            --json 2>&1 | tee /tmp/add-result.json || true

          cat /tmp/add-result.json

          echo "==> Setting environment variables..."
          railway variables set \
            "API_KEY=img_svc_b77260f936b43d3e521eafb5f244985f2619b01e" \
            "CORS_ORIGINS=https://plantathome-admin-staging.vercel.app,http://localhost:3002" \
            "PORT=3000" \
            "NODE_ENV=production" \
            --service "plantathome-image-service" \
            --json 2>&1 | tee /tmp/vars-result.json || true

          cat /tmp/vars-result.json

          echo "==> Generating Railway domain for service..."
          railway domain generate \
            --service "plantathome-image-service" \
            --json 2>&1 | tee /tmp/domain-result.json || true

          cat /tmp/domain-result.json
          echo "==> Done. Check Railway dashboard for service URL."
          echo "NOTE: Add OPENAI_API_KEY manually in Railway dashboard for this service."
