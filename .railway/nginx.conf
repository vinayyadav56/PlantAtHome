user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    client_body_temp_path /tmp/nginx_client_body;

    # ── Response compression ────────────────────────────────────────────────
    # The API served every response uncompressed. These payloads are JSON with
    # heavily repeated keys, so they compress extremely well — MEASURED on the
    # real endpoints:
    #     GET /categories?parent=null&limit=100   59,274 ->  2,997 B   19.8x
    #     GET /products?limit=100                174,593 -> 12,377 B   14.1x
    #     GET /popular-products?limit=10          24,248 ->  1,737 B   14.0x
    #     GET /products?limit=20                  36,504 ->  3,846 B    9.5x
    #
    # This is the single cheapest bandwidth win available, and it also relieves
    # the FastCGI buffers below: two production incidents were caused by
    # responses outgrowing them.
    #
    # Level 5 rather than the default 1: JSON gains a lot between 1 and 5 and
    # very little after, so this is near the knee of the CPU/ratio curve.
    gzip on;
    gzip_vary on;                 # so caches key on Accept-Encoding
    gzip_proxied any;             # compress even when behind Cloudflare/ALB
    gzip_comp_level 5;
    gzip_min_length 1024;         # below this the header costs more than it saves
    gzip_types
        application/json
        application/ld+json
        application/javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    server {
        listen 80;
        root /var/www/html/public;
        index index.php;

        # Nginx-native health check — returns 200 before PHP-FPM is ready
        location = /api/health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;

            # Root-cause fix for a recurring class of bug: nginx's COMPILED-IN
            # default fastcgi buffers (~32-36KB total on this image) silently
            # truncate any PHP-FPM response larger than that — no error, no
            # non-2xx status, just a cut-off JSON body that breaks whatever
            # parses it client-side. This bit OrderController's list once
            # (worked around there by slimming the payload) and again bit
            # LocationController::cities() once IndiaCitySeeder grew the master
            # city list to ~1,600 rows (~150KB unfiltered). Fix the CLASS of bug
            # here instead of re-slimming every large admin response forever:
            # buffer generously in memory, and let anything still larger spill
            # to disk (temp path below) rather than truncate.
            fastcgi_buffer_size 64k;
            fastcgi_buffers 32 64k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_temp_path /tmp/nginx_fastcgi_temp;
            fastcgi_max_temp_file_size 1024m;
        }

        location ~ /\.(?!well-known).* { deny all; }
    }
}
