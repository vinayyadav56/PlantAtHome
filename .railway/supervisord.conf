[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Default queue worker — fast notifications (email/SMS/WhatsApp) + notify-logs etc.
; State-mutating listeners (ProductInventoryDecrement/Restore stock, FlashSaleProductProcess
; pricing, OwnershipTransfer, CheckAndSetDefaultCard) are intentionally NOT ShouldQueue and run
; synchronously, so a worker outage can never silently corrupt stock/prices/ownership — only
; notification delivery is deferred here. retry_after (960s) > every worker --timeout.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=default --tries=3 --timeout=120 --sleep=3 --max-time=3600 --backoff=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Dedicated worker for the slow AI care-plan generation (up to ~8 plants x 90s), isolated on
; its own queue so it never blocks fast notifications. --timeout 900 < retry_after 960.
[program:queue-worker-careplan]
command=php /var/www/html/artisan queue:work --queue=careplans --tries=2 --timeout=900 --sleep=5 --max-time=3600 --backoff=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Dedicated worker for marketing-campaign sends (materialize + Send*Jobs), isolated on its own
; queue so a large blast never starves the fast `default` OTP/order notifications. Per-job
; idempotency (only sendable notifications are picked) makes a timeout safe. --timeout 280 < 960.
[program:queue-worker-marketing]
command=php /var/www/html/artisan queue:work --queue=marketing --tries=3 --timeout=280 --sleep=3 --max-time=3600 --backoff=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Dedicated worker for batch AI image generation (multi-hour claim-loop jobs + ZIP packaging),
; isolated on the `images` queue. Rows are claimed atomically and completed image slots are
; never regenerated, so a timeout/redeploy safely resumes. --timeout 900 < retry_after 960.
[program:queue-worker-images]
command=php /var/www/html/artisan queue:work --queue=images --tries=2 --timeout=900 --sleep=5 --max-time=3600 --backoff=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Instant admin previews (old Node image-service flow, consolidated) — own worker so a
; preview never queues behind a running batch. Short jobs (~30-90s each).
[program:queue-worker-images-instant]
command=php /var/www/html/artisan queue:work --queue=images-instant --tries=2 --timeout=320 --sleep=3 --max-time=3600 --backoff=15
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Bulk AI product-content generation (descriptions + categories). Fast text jobs;
; own worker so a content run never queues behind an image batch.
[program:queue-worker-content]
command=php /var/www/html/artisan queue:work --queue=content --tries=2 --timeout=600 --sleep=3 --max-time=3600 --backoff=15
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
