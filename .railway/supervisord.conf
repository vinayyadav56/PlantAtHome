[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Default queue worker — fast notifications (email/SMS/WhatsApp) + notify-logs etc.
; Stock decrements stay SYNCHRONOUS (their listeners are not ShouldQueue) so a worker
; outage can never silently stop inventory from decrementing. retry_after (960s) > --timeout.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=default --tries=3 --timeout=120 --sleep=3 --max-time=3600 --backoff=10
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Dedicated worker for the slow AI care-plan generation (up to ~8 plants x 90s), isolated on
; its own queue so it never blocks fast notifications. --timeout 900 < retry_after 960.
[program:queue-worker-careplan]
command=php /var/www/html/artisan queue:work --queue=careplans --tries=2 --timeout=900 --sleep=5 --max-time=3600 --backoff=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
