; Raise PHP upload limits at the docroot so admin media (logos/banners) up to
; ~20MB upload everywhere php-fpm reads .user.ini (prod EC2 + any host). The
; staging Railway image also sets these via a conf.d ini; this covers prod.
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 120
